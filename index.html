<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BrainMaid</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BrainMaid">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EAF1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#152121" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* One calm column, a fixed four-tab bar, a round + button for adding anything. */
:root{
  --bg:#EAF1EE; --surface:#FBFDFC; --soft:#DCEBE7; --line:#D3E0DB;
  --ink:#1F3A3A; --muted:#56706D; --accent:#3F837B; --on-accent:#FBFDFC;
  --r-chip:#DCEBE7; --r-ink:#2F6F68; --t-chip:#F3E3A8; --t-ink:#6B5A1A;
  --mila:#4A5FB0; --chilli:#B4482C; --bad:#A8412F;
  --display:Georgia,"Times New Roman",serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Verdana,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#152121; --surface:#1D2C2C; --soft:#243A38; --line:#2E4241;
  --ink:#E3EEEA; --muted:#9DB5B0; --accent:#7CC0B5; --on-accent:#112020;
  --r-chip:#243A38; --r-ink:#7CC0B5; --t-chip:#4A4428; --t-ink:#F0DC9A;
  --mila:#9DB0FF; --chilli:#FF9A7E; --bad:#FF8F80; color-scheme:dark; } }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 150px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:1.75rem;line-height:1.15;margin:0}
.sub{color:var(--muted);font-size:.9rem;margin:0}
h2{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 2px 0;font-weight:700}
.card{background:var(--surface);border-radius:20px;padding:16px 18px;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.card.now{border-radius:24px;padding:20px}
.card.now .k{color:var(--accent);font-weight:700;margin:0}
.big{font-family:var(--display);font-size:1.45rem;line-height:1.2;margin:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.rows{background:var(--surface);border-radius:20px;padding:2px 16px;box-shadow:0 1px 0 var(--line)}
.tick{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;padding:0;display:grid;place-items:center;color:var(--on-accent)}
.tick.on{background:var(--accent);border-color:var(--accent)}
.main{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.main .t{display:block;overflow-wrap:anywhere}
.main .m{display:block;color:var(--muted);font-size:.85rem;margin-top:1px}
.done .t{text-decoration:line-through;color:var(--muted)}
.time{flex:none;width:52px;font-size:.85rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.who{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 7px;margin-right:6px;vertical-align:1px}
.who.R{background:var(--r-chip);color:var(--r-ink)} .who.T{background:var(--t-chip);color:var(--t-ink)} .who.both{background:var(--soft);color:var(--muted)}
.late{color:var(--bad);font-weight:700}
.btn{border:0;border-radius:999px;background:var(--ink);color:var(--surface);font-weight:700;padding:12px 20px;min-height:48px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.small{min-height:38px;padding:6px 14px;font-size:.9rem}
.btn.full{width:100%}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--line)}
.link{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:700}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:8px 14px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600;font-size:.92rem;color:var(--ink);min-height:40px}
.chip.on{background:var(--soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:700}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line)}
.seg button{border:0;background:transparent;border-radius:999px;padding:9px 6px;font-weight:600;font-size:.92rem;color:var(--muted);min-height:40px}
.seg button.on{background:var(--soft);color:var(--accent);font-weight:700}
.add{display:flex;gap:8px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],select,textarea{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;min-height:48px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.add input{border-radius:999px}
label.l{display:block;font-size:.85rem;font-weight:700;color:var(--muted);margin:4px 0 6px}
.empty{color:var(--muted);text-align:center;padding:18px 8px;margin:0}
.banner{background:var(--t-chip);color:var(--t-ink);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;font-size:.95rem}
.banner p{margin:0}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.split{display:grid;grid-template-columns:auto 1fr;gap:10px;margin:0;align-items:start}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:6px;padding:1px 7px;margin-top:2px}
.t-mila{color:var(--mila)} .t-spice{color:var(--chilli)}
dl.kv{margin:0;display:grid;gap:4px}
dl.kv div{display:grid;grid-template-columns:4.6rem 1fr;gap:8px}
dl.kv dt{font-weight:700} dl.kv dd{margin:0;color:var(--muted)}
.rate{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rate .b{display:flex;gap:6px}
.rb{width:48px;height:42px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:1rem}
.rb.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.gear{flex:none;background:var(--surface);border:0;border-radius:999px;width:44px;height:44px;display:grid;place-items:center;box-shadow:0 1px 0 var(--line);color:var(--muted)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:700;color:var(--muted);position:relative}
nav.tabs button.on{color:var(--accent)}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--accent);color:var(--on-accent);font-size:.65rem;border-radius:999px;padding:0 5px;min-width:17px;line-height:17px}
.fab{position:fixed;z-index:21;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 74px);width:62px;height:62px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);font-size:2rem;line-height:1;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}

#sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(10,20,20,.45)}
.sheet{position:relative;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 4px}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 148px);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:999px;font-weight:600;font-size:.92rem;z-index:60;max-width:calc(100% - 32px);text-align:center}
.center{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><div class="wrap center"><p class="empty">Opening BrainMaid…</p></div></div>
<div id="sheet-wrap" hidden><div class="scrim" data-act="close-sheet"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
